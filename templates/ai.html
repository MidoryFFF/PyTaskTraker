<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Планировщик — ИИ-ассистент</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f2f4f7;color:#222}
  header{background:#1f2a44;color:#fff;padding:12px 24px;display:flex;gap:16px;align-items:center}
  header a{color:#9ecbff;text-decoration:none}
  main{max-width:820px;margin:24px auto;padding:0 16px}
  #chat{background:#fff;border-radius:10px;padding:16px;height:55vh;overflow-y:auto;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .msg{margin:8px 0;padding:10px 14px;border-radius:10px;max-width:85%;white-space:pre-wrap}
  .user{background:#d9e6ff;margin-left:auto}
  .ai{background:#eef1f5}
  .tool{background:#fff7e0;font-size:12px;font-family:monospace}
  .bar{display:flex;gap:8px;margin-top:12px}
  input[type=text]{flex:1;padding:10px;border-radius:8px;border:1px solid #ccc;font-size:15px}
  button{padding:10px 16px;border:none;border-radius:8px;background:#1f2a44;color:#fff;cursor:pointer}
  #status{font-size:13px;color:#555;margin-bottom:8px}
</style>
</head>
<body>
<header><b>🤖 Планировщик</b><a href="/">Календарь</a><a href="/ai"><b>ИИ-ассистент</b></a></header>
<main>
  <div id="status">Проверка Ollama…</div>
  <div id="chat"></div>
  <div class="bar">
    <input type="text" id="inp" placeholder="Напр.: добавь встречу завтра в 15:00 на час и найди свободное время в пятницу"
           onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Отправить</button>
    <button onclick="reset()">Сброс</button>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
function add(cls,text){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;$('#chat').append(d);$('#chat').scrollTop=1e9;}
async function send(){
  const t=$('#inp').value.trim(); if(!t)return; $('#inp').value='';
  add('user',t); add('tool','⏳ думаю…');
  try{
    const r=await fetch('/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});
    const j=await r.json();
    document.querySelector('.msg.tool:last-of-type')?.remove();
    (j.trace||[]).forEach(tr=>add('tool','🔧 '+tr.tool+'('+JSON.stringify(tr.args)+') → '+tr.result));
    add('ai',j.answer||j.error||'(пусто)');
  }catch(e){add('ai','Ошибка сети: '+e);}
}
async function reset(){await fetch('/api/ai/reset',{method:'POST'});$('#chat').innerHTML='';add('ai','Диалог сброшен.');checkStatus();}
async function checkStatus(){
  const s=await (await fetch('/api/ai/status')).json();
  $('#status').textContent = s.ollama_available
    ? `✅ Ollama доступен. Модель: ${s.model}, num_ctx: ${s.num_ctx}. Модели: ${(s.models||[]).join(', ')||'нет загруженных'}`
    : '⚠️ Ollama недоступен. Запустите: ollama serve && ollama pull llama3.1';
}
checkStatus();
</script>
</body>
</html>
